name: Release

# Binaries are built from the tag, never from main, so what ships is exactly
# what the tag contains. Pushing a v* tag builds and attaches automatically;
# workflow_dispatch exists to attach binaries to a tag that was cut before
# this workflow did.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to (for example v0.4.1)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: blockchain-explorer

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing should not cost the other six their binaries.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Statically linked, so it runs on distributions older than the
          # builder's glibc. Possible because the TLS stack is rustls, not
          # OpenSSL.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      # ring needs a C compiler for the target, not just a Rust linker.
      - name: Point cargo and cc at the cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Point cc at musl-gcc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The release profile already strips symbols and optimises for size.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/' | tr -d '\r')"
          NAME="$BIN-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$NAME"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/$BIN" "dist/$NAME/"
          fi

          cp README.md README.en.md CHANGELOG.md CHANGELOG.en.md LICENSE "dist/$NAME/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
            echo "ASSET=dist/$NAME.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
            echo "ASSET=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
